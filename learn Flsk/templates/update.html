{% extends 'Base.html' %}

{% block body %}
<center>
    <h1 class="my-3">Update Todo</h1>
</center>
<div class="container my-4">
    <h2>
        <center>Update your todo</center>
    </h2>
    <form action="/update/{{todo.sno}}" method="post">
        <div class="mb-3">
            <label for="title" class="form-label">Task To Do </label>
            <input type="text" class="form-control" name="title" id="title" aria-describedby="emailHelp"
                value="{{todo.title}}">
            <div id="emailHelp" class="form-text">lets do it</div>
        </div>
        <div class="mb-3">
            <label for="desc" class="form-label">task description</label>
            <input type="text" class="form-control" name="desc" id="desc" value="{{todo.desc}}">
        </div>
        <center>
            <button type="submit" class="btn btn-primary">Update</button>
        </center>
    </form>
</div>

<!-- Optional JavaScript; choose one of the two! -->

<!-- Option 1: Bootstrap Bundle with Popper -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM"
    crossorigin="anonymous"></script>

<!-- Option 2: Separate Popper and Bootstrap JS -->

    -->

{% endblock %}
